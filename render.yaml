services:
  - type: web
    name: wearwell-api-staging
    runtime: node
    rootDir: Backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars: &wearwellEnv
      - key: NODE_ENV
        value: staging
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TEXT_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2
  - type: worker
    name: wearwell-worker-staging
    runtime: node
    rootDir: Backend
    buildCommand: npm ci
    startCommand: npm run worker
    envVars: *wearwellEnv
